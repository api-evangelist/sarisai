name: SarisAI
description: >-
  SarisAI (Saris) builds agentic AI workflow automation for banks and credit
  unions, automating multi-step back-office operations across lending,
  compliance, and operations while keeping human oversight and audit trails.
  Its platform runs six specialized AI agents (Document, System, Inbox, Audit &
  Monitoring, External, and Income & Financial Analysis) that handle document
  intake, income verification, data validation, borrower communication, and
  post-close regulatory checks across mortgage, consumer, and commercial
  lending. Saris integrates directly with core banking, loan origination, and
  document systems (Fiserv, Encompass, OnBase/Hyland, Meridian) and LLM
  providers (OpenAI, Anthropic, Gemini). The company is a Homebrew-backed
  fintech and is SOC 2, GDPR, GLBA, and CUSO certified. It is a private B2B
  platform with no public developer API, OpenAPI, or self-service surface; this
  profile captures its identity and security posture for the API Evangelist
  network.
